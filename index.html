<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALLOWEEN 2026: SURVIVAL GAME</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #040208; color: #f3f4f6; overflow-x: hidden; }
    .font-gothic { font-family: 'Cinzel', serif; }
    @keyframes spookyPulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.03); } }
    .anim-spooky { animation: spookyPulse 6s ease-in-out infinite; }
    .youtube-bg { pointer-events: none; transform: scale(1.3); width: 100%; height: 100%; }
    @keyframes revealTension { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
    .anim-reveal-tension { animation: revealTension 1.5s forwards; }
    
    /* 스크롤바 숨기기 (사유 박스용) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col" id="bodyRoot">
  <audio id="bellSound" src="assets/bgm/bell.mp3" preload="auto"></audio>

  <!-- =========================================================
       VIEW 1: 📺 거실 TV 전광판 화면 (#tv)
  ========================================================== -->
  <main id="view-tv" class="hidden flex-1 flex flex-col justify-between relative overflow-hidden bg-[#030106] min-h-screen">
    <div id="tvStartOverlay" class="absolute inset-0 z-50 bg-black/90 flex flex-col items-center justify-center cursor-pointer" onclick="initTVAudio()">
      <div class="text-white text-3xl font-bold animate-pulse mb-4">📺 화면을 클릭하여 시스템과 사운드를 활성화하세요</div>
    </div>
    
    <div class="absolute inset-0 z-0 overflow-hidden bg-black flex items-center justify-center">
      <div id="tvYoutubeBg" class="youtube-bg"></div>
      <video id="tvLocalVideo" src="assets/video/opening.mp4" class="w-full h-full object-contain hidden" playsinline></video>
      <div id="tvDarkFilter1" class="absolute inset-0 bg-gradient-to-b from-purple-950/60 via-black to-red-950/50 anim-spooky pointer-events-none"></div>
      <div id="tvDarkFilter2" class="absolute inset-0 bg-black/40 pointer-events-none"></div>
    </div>

    <div id="tvTopHeader" class="flex items-center justify-between px-8 py-4 border-b border-white/10 z-10 bg-black/60 backdrop-blur-md hidden">
      <div class="flex items-center gap-3"><span class="text-2xl">🕯️</span>
        <div><div class="text-[10px] text-orange-400 font-bold uppercase">LIVING ROOM LOUNGE</div><h1 class="text-xl font-black text-white" id="tvStageTitleText"></h1></div>
      </div>
      <div class="flex items-center gap-3">
        <div class="bg-red-950/80 border border-red-500/60 rounded-2xl px-3 py-1 text-center shadow-lg" id="tvTimerBox">
          <div class="text-[9px] text-red-300 font-bold">⏰ 심판까지</div>
          <div class="text-sm font-black text-red-400 font-gothic tracking-wider" id="tvCountdownTimer">00:00:00</div>
        </div>
        <div class="text-sm font-black font-gothic text-orange-400 bg-black/70 border border-white/20 rounded-2xl px-4 py-2" id="tvRealtimeClock">18:00:00</div>
      </div>
    </div>
    
    <div id="tvStageContainer" class="my-auto py-8 px-8 z-10 flex-1 flex flex-col items-center justify-center w-full"></div>
    <div id="tvFooterBar" class="px-8 py-3 border-t border-white/10 flex justify-between text-xs text-gray-400 z-10 bg-black/70 backdrop-blur-md hidden">
      <div>🕯️ 호스트 마스터 리모컨으로 제어됩니다.</div><div class="text-orange-300 font-bold">HALLOWEEN SURVIVAL 2026</div>
    </div>
  </main>

  <!-- =========================================================
       VIEW 2: 📱 스마트폰 지령서 (#mobile)
  ========================================================== -->
  <main id="view-mobile" class="hidden flex-1 py-6 px-4 flex justify-center items-start bg-[#06040a]">
    <div class="w-full max-w-md bg-[#130e21] border-2 border-purple-500/40 rounded-3xl overflow-hidden shadow-2xl p-5 space-y-4">
      <h2 class="text-base font-black text-white border-b border-purple-500/30 pb-3">참가자 지령서</h2>
      <div id="mobileLoginBox" class="space-y-3">
        <input id="inputCode" type="text" placeholder="비밀 코드 입력 (예: T5780)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white font-black uppercase text-center">
        <input id="inputName" type="text" maxlength="2" placeholder="성 제외 이름 두 글자 입력" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white font-bold text-center">
        <button onclick="loginMobile()" class="w-full py-3 bg-orange-600 text-white font-black rounded-xl">정체 확인하기</button>
      </div>
      <div id="mobileCardContent" class="hidden space-y-4"></div>
    </div>
  </main>

  <!-- =========================================================
       VIEW 3: 🗳️ 최종 투표 및 미션 보고 (#vote)
  ========================================================== -->
  <main id="view-vote" class="hidden flex-1 py-6 px-4 flex justify-center items-start bg-[#050100]">
    <div class="w-full max-w-md bg-[#1a0505] border-2 border-red-800 rounded-3xl p-5 space-y-4 text-white">
      <h2 class="text-xl font-black text-red-500 border-b border-red-800/50 pb-3 text-center">⚖️ 진실의 제단</h2>
      <div id="voteLoginBox" class="space-y-3">
        <input id="voteInputCode" type="text" placeholder="본인의 비밀 코드 입력" class="w-full bg-black border border-red-900 rounded-xl px-4 py-3 text-center font-bold uppercase">
        <button onclick="loginVote()" class="w-full py-3 bg-red-800 font-black rounded-xl">입장하기</button>
      </div>
      <div id="voteFormContent" class="hidden space-y-4"></div>
    </div>
  </main>

  <!-- =========================================================
       VIEW 4: 🛠️ 호스트 GM 리모컨 (#admin)
  ========================================================== -->
  <main id="view-admin" class="hidden flex-1 py-4 px-3 flex justify-center items-start bg-[#050308] overflow-y-auto">
    <div class="w-full max-w-lg space-y-4 pb-10">
      
      <div class="bg-blue-950/40 border border-blue-500/30 rounded-2xl p-3 flex items-center justify-between">
        <h3 class="text-xs font-black text-blue-400">🔊 TV 사운드 조절</h3>
        <div class="flex items-center gap-2">
          <input type="range" id="adminVol" min="0" max="100" value="100" onchange="changeVolume(this.value)" class="w-24">
          <button id="adminMuteBtn" onclick="toggleMute()" class="px-3 py-1 bg-blue-800 rounded text-xs text-white">음소거</button>
        </div>
      </div>

      <div class="bg-[#120d1d] border-2 border-orange-500/50 rounded-2xl p-4 space-y-3">
        <div class="flex justify-between items-center border-b border-orange-500/30 pb-2">
          <h2 class="text-sm font-black text-white">📱 화면 컨트롤러</h2>
          <div class="text-[10px] text-orange-200 bg-black/40 px-2 py-1 rounded" id="remoteCurrentStageLabel"></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <button onclick="prevStage()" class="py-2 bg-gray-800 text-white font-black rounded-xl text-xs">◀ 이전</button>
          <button onclick="nextStage()" class="py-2 bg-orange-600 text-white font-black rounded-xl text-xs">다음 ▶</button>
        </div>
        <div id="remoteStageList" class="grid grid-cols-2 gap-1.5 text-[10px]"></div>
      </div>

      <div class="bg-[#120d1d] border-2 border-yellow-500/50 rounded-2xl p-4 space-y-3">
        <h3 class="text-sm font-black text-yellow-400 border-b border-yellow-500/30 pb-2">🕹️ 미니게임 컨트롤러</h3>
        <div class="flex items-center justify-between text-white text-xs">
          <span>문제: <span id="adminMg1QNum" class="font-bold text-yellow-300">연습문제</span></span>
          <button onclick="toggleMg1A()" class="bg-yellow-600 px-3 py-1 rounded text-black font-bold">정답 뷰 토글</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="changeMg1Q(-1)" class="bg-gray-800 text-white py-1 rounded text-xs">◀ 이전 문제</button>
          <button onclick="changeMg1Q(1)" class="bg-gray-800 text-white py-1 rounded text-xs">다음 문제 ▶</button>
        </div>
      </div>

      <div class="bg-[#120d1d] border-2 border-purple-500/50 rounded-2xl p-4 space-y-3">
        <h3 class="text-sm font-black text-purple-400 border-b border-purple-500/30 pb-2">🎮 점수 제어판</h3>
        <div id="adminScoreBoard" class="space-y-2"></div>
      </div>

      <div class="bg-[#120d1d] border-2 border-red-500/50 rounded-2xl p-4 space-y-4">
        <div class="flex justify-between items-center border-b border-red-500/30 pb-2">
          <h3 class="text-sm font-black text-red-400">🗳️ 실시간 투표 모니터링</h3>
          <button onclick="resetVotes()" class="text-[10px] bg-red-900 px-2 py-1 rounded text-white">투표 초기화</button>
        </div>
        <div class="bg-black/60 p-2 rounded-xl border border-red-500/30">
          <h4 class="text-[11px] font-bold text-red-300 mb-2">📊 전체 득표 순위 (유효/전체/무효)</h4>
          <div id="adminVoteRanking" class="space-y-1 text-[10px] text-gray-300"></div>
        </div>
        <div id="adminVoteStatus" class="space-y-2 text-[10px]"></div>
      </div>

      <div class="bg-[#120d1d] border-2 border-green-500/50 rounded-2xl p-4 space-y-3">
        <div class="flex justify-between items-center border-b border-green-500/30 pb-2">
          <h3 class="text-sm font-black text-green-400">👥 등록 참가자 관리</h3>
          <button onclick="hardResetPlayers()" class="text-[10px] bg-red-600 px-2 py-1 rounded text-white font-bold">전체 초기화</button>
        </div>
        <div id="adminPlayerMgmt" class="space-y-2 text-xs"></div>
      </div>
      
    </div>
  </main>

  <script>
    firebase.initializeApp({ databaseURL: "https://halloween-2026-1407e-default-rtdb.firebaseio.com/" });
    const db = firebase.database();
    
    const VID_BGM = "TkEzDC1BeMU"; 
    
    const STAGES = [
      { id: 'STAGE_REST_6PM',       title: '[대기] 평온한 저택 라운지', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_STORY_INTRO',    title: '[오프닝] 저주의 시작 (로컬 영상)', type: 'local', vid: 'opening.mp4' },
      { id: 'STAGE_QR_GUIDE',       title: '[접속] QR 및 룰 설명', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_PARTY_ROOM',     title: '[파티] 할로윈 나이트 파티', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_GAME1_READY',    title: '[미니게임] 준비 화면', type: 'yt', vid: VID_BGM, sound: 'bell' },
      { id: 'STAGE_GAME1_PLAY',     title: '[미니게임] 문제 진행 & 점수판', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_GAME1_WIN',      title: '[미니게임] 우승자 발표', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_VOTE_10PM',      title: '[심판] 10시 최후의 심판', type: 'yt', vid: VID_BGM, sound: 'bell' },
      { id: 'STAGE_VOTE_QR',        title: '[투표] 투표/미션보고 접속QR', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_1',  title: '[결과 1] 최다 득표 1, 2위 사유 공개', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_2',  title: '[결과 2] 전체 정체 공개 및 심판대', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_3',  title: '[결과 3] 유령 미션 성공/실패 공개', type: 'yt', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_4',  title: '[엔딩] 최종 진영 승패 확정', type: 'yt', vid: VID_BGM }
    ];

    const MG1_DATA = [
      { q: '할로윈퀴즈0.png', a: '0_도깨비.jpg', title: '도깨비 (연습)' }, { q: '할로윈퀴즈1.png', a: '1_기생충.jpg', title: '기생충' },
      { q: '할로윈퀴즈2.png', a: '2_오디세이.jpg', title: '오디세이' }, { q: '할로윈퀴즈3.png', a: '3_어벤져스.jpg', title: '어벤져스' },
      { q: '할로윈퀴즈4.png', a: '4_겨울왕국2.jpg', title: '겨울왕국 2' }, { q: '할로윈퀴즈5.png', a: '5_인터스텔라.jpg', title: '인터스텔라' },
      { q: '할로윈퀴즈6.png', a: '6_말할수없는비밀.jpg', title: '말할 수 없는 비밀' }, { q: '할로윈퀴즈7.png', a: '7_명량.jpg', title: '명량' },
      { q: '할로윈퀴즈8.png', a: '8_택시운전사.jpg', title: '택시운전사' }, { q: '할로윈퀴즈9.png', a: '9_나우유씨미.jpg', title: '나우 유 씨 미' },
      { q: '할로윈퀴즈10.png', a: '10_폭싹속았수다.jpg', title: '폭싹 속았수다' }, { q: '할로윈퀴즈11.png', a: '11_꽃보다남자.jpg', title: '꽃보다 남자' }
    ];

    const INITIAL_CARDS = {
      'W3611': { code: 'W3611', charIcon: '🐺', charName: '늑대인간', playerName: '', score: 0,
        story: '보름달이 뜨면 감각이 예민해지는 은빛 늑대인간입니다.', secretTitle: '👻 [진짜 정체: 유령]',
        mission: '※ 조력자: 🔮 마녀(M7420, 미치광이)\n※ 미치광이는 약점 수집 대상이 아닙니다!\n\n[미션: 서로 다른 3명의 약점 캐내기!]\n1. 가장 무섭게 본 영화 🎬\n2. 가장 싫어하는 음식 🤮\n3. 꿔봤던 최악의 악몽 🛌👻\n\n🚨 투표 시간에 알아낸 3가지를 폼에 직접 입력하게 됩니다.', isGhost: true },
      'M7420': { code: 'M7420', charIcon: '🔮', charName: '마녀', playerName: '', score: 0,
        story: '비밀스러운 약초와 저주를 다루는 숲속의 마녀입니다.', secretTitle: '🤪 [진짜 정체: 미치광이]',
        mission: '※ 당신은 유령이 누구인지 모릅니다.\n※ 유령의 미션: 인간들에게서 약점(영화, 음식, 악몽)을 캐내는 중입니다.\n\n[미션: 유령 대신 의심을 받아 처형대에 올라가면 단독 승리합니다!]', isMadman: true },
      'T5780': { code: 'T5780', charIcon: '✝️', charName: '퇴마사', playerName: '', score: 0, story: '성수와 십자가로 악령을 쫓는 퇴마사입니다.', secretTitle: '🎃 [정체: 인간 생존자]' },
      'K2491': { code: 'K2491', charIcon: '🧟', charName: '강시', playerName: '', score: 0, story: '부적이 붙은 강시입니다.', secretTitle: '🎃 [정체: 평범한 인간]' },
      'B8312': { code: 'B8312', charIcon: '🧛', charName: '뱀파이어', playerName: '', score: 0, story: '고풍스러운 뱀파이어입니다.', secretTitle: '🎃 [정체: 선량한 사람]' },
      'Z9154': { code: 'Z9154', charIcon: '💀', charName: '좀비', playerName: '', score: 0, story: '탈출한 좀비 분장 생존자입니다.', secretTitle: '🎃 [정체: 인간 생존자]' },
      'S4823': { code: 'S4823', charIcon: '⏳', charName: '사신', playerName: '', score: 0, story: '사신 코스프레 생존자입니다.', secretTitle: '🎃 [정체: 선량한 사람]' }
    };

    let appData = { state: { stageIdx: 0 }, config: { vol: 100, mute: false }, mg1: { qIdx: 0, showA: false }, cards: JSON.parse(JSON.stringify(INITIAL_CARDS)), votes: {} };
    let activeMobileCode = null; let activeVoteCode = null; let ytPlayer = null; let tvAudioInited = false; let currentStageForSound = -1;

    function onYouTubeIframeAPIReady() { ytPlayer = new YT.Player('tvYoutubeBg', { videoId: VID_BGM, playerVars: { 'autoplay': 1, 'controls': 0, 'mute': 1, 'loop': 1, 'playlist': VID_BGM } }); }
    
    function applyAudioConfig() {
      const v = appData.config.vol / 100; const m = appData.config.mute;
      if(ytPlayer && ytPlayer.setVolume) { if(m) ytPlayer.mute(); else { ytPlayer.unMute(); ytPlayer.setVolume(appData.config.vol); } }
      const loc = document.getElementById('tvLocalVideo'); if(loc) { loc.volume = v; loc.muted = m; }
      const btn = document.getElementById('adminMuteBtn');
      if(btn) { btn.innerText = m ? "소리 켜기" : "음소거"; btn.className = m ? "px-3 py-1 bg-red-600 rounded text-xs text-white" : "px-3 py-1 bg-blue-800 rounded text-xs text-white"; }
    }

    function initTVAudio() { tvAudioInited = true; document.getElementById('tvStartOverlay').style.display = 'none'; applyAudioConfig(); renderTV(); }
    
    // DB 버전 v13 적용
    db.ref('halloween_state_v13').on('value', (snap) => {
      if (snap.val()) { appData = snap.val(); if(!appData.votes) appData.votes={}; if(!appData.mg1) appData.mg1={qIdx:0,showA:false}; }
      else db.ref('halloween_state_v13').set(appData);
      applyAudioConfig();
      renderTV(); renderAdminRemote();
      if(activeMobileCode) { const c = appData.cards[activeMobileCode]; const sEl = document.getElementById('mobileScoreSpan'); if (sEl && c) sEl.innerText = c.score; }
    });
    
    function syncSave() { db.ref('halloween_state_v13').set(appData); }
    
    setInterval(() => { 
      const now = new Date();
      const clock = document.getElementById('tvRealtimeClock');
      if(clock) clock.innerText = now.toLocaleTimeString('ko-KR', {hour12:false});
      
      const target = new Date(); target.setHours(22, 0, 0, 0);
      let diff = target - now; if(diff < 0) diff = 0;
      const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
      const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
      const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
      const timerEl = document.getElementById('tvCountdownTimer');
      if (timerEl) timerEl.innerText = `${h}:${m}:${s}`;
    }, 1000);

    window.addEventListener('hashchange', routeView);
    function routeView() {
      const hash = window.location.hash.replace('#', '') || 'tv';
      ['tv', 'mobile', 'admin', 'vote'].forEach(v => { const el = document.getElementById(`view-${v}`); if(el) el.classList.toggle('hidden', v !== hash); });
      if(hash==='admin') document.getElementById('adminVol').value = appData.config.vol;
      renderTV(); renderAdminRemote();
      if(hash==='mobile' && activeMobileCode) renderMobileCard();
      if(hash==='vote' && activeVoteCode) renderVoteForm();
    }
    
    function getDisplayName(code) { const c = appData.cards[code]; return c && c.playerName ? `${c.charName}(${c.playerName})` : (c ? c.charName : '알수없음'); }

    function getVoteResults() {
      let validCounts = {}; let invalidCounts = {}; let allReasons = {};
      Object.values(appData.cards).forEach(c => { 
        if(c.playerName) { validCounts[c.code] = 0; invalidCounts[c.code] = 0; allReasons[c.code] = []; } 
      });
      
      Object.keys(appData.votes).forEach(voter => {
        const v = appData.votes[voter];
        if (v.isGhostReport) return;
        const isInvalid = (voter === 'W3611' || voter === 'M7420'); // 유령, 미치광이 표 무효
        if (v.targets) {
          v.targets.forEach((t, i) => {
            if(t) {
              if (isInvalid) invalidCounts[t] = (invalidCounts[t]||0) + 1;
              else validCounts[t] = (validCounts[t]||0) + 1;
              if (v.reasons && v.reasons[i]) allReasons[t].push(v.reasons[i]);
            }
          });
        }
      });

      const getPriority = (code) => { if (code === 'M7420') return 3; if (code === 'W3611') return 1; return 2; };

      const sorted = Object.keys(validCounts).map(code => [code, validCounts[code]]).sort((a,b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        const pDiff = getPriority(b[0]) - getPriority(a[0]);
        if (pDiff !== 0) return pDiff; 
        return Math.random() - 0.5; 
      });

      return { 
        validCounts, invalidCounts, allReasons,
        top1: sorted.length > 0 && sorted[0][1] > 0 ? sorted[0] : null, 
        top2: sorted.length > 1 && sorted[1][1] > 0 ? sorted[1] : null,
        sortedAll: sorted,
        isGhostExecuted: sorted.length > 0 && sorted[0][1] > 0 && (sorted[0][0] === 'W3611' || (sorted.length > 1 && sorted[1][1] > 0 && sorted[1][0] === 'W3611')),
        isMadmanExecuted: sorted.length > 0 && sorted[0][1] > 0 && (sorted[0][0] === 'M7420' || (sorted.length > 1 && sorted[1][1] > 0 && sorted[1][0] === 'M7420'))
      };
    }

        const res = getVoteResults();
        const gV = appData.votes['W3611'];
        const isMissionSuccess = (gV && gV.reports && gV.reports.length === 3 && gV.reports.every(r => r.target && r.target !== 'FAIL' && r.text && r.text.trim() !== ''));

        let vicText = ""; let vicColor = "";
        
        if (res.isGhostExecuted && res.isMadmanExecuted) {
          vicText = "🎃🤪 인간 & 미치광이 동반 승리!<br><span class='text-3xl text-gray-300 mt-4 block'>(유령 색출 성공 & 미치광이 목적 달성)</span>"; vicColor = "text-yellow-400";
        } else if (res.isGhostExecuted) {
          vicText = "🎃 인간 진영 승리!<br><span class='text-3xl text-gray-300 mt-4 block'>(유령 색출 성공)</span>"; vicColor = "text-green-400";
        } else if (res.isMadmanExecuted && isMissionSuccess) {
          vicText = "👻🤪 유령 & 미치광이 동반 승리!<br><span class='text-3xl text-gray-300 mt-4 block'>(완벽한 농락 & 미션 완수)</span>"; vicColor = "text-red-400";
        } else if (res.isMadmanExecuted && !isMissionSuccess) {
          vicText = "🤪 미치광이 단독 승리!<br><span class='text-3xl text-gray-300 mt-4 block'>(유령은 미션 실패로 패배)</span>"; vicColor = "text-purple-400";
        } else if (!res.isMadmanExecuted && isMissionSuccess) {
          vicText = "👻 유령 단독 승리!<br><span class='text-3xl text-gray-300 mt-4 block'>(심판 회피 & 미션 완수)</span>"; vicColor = "text-red-500";
        } else {
          vicText = "💀 모두의 패배...<br><span class='text-3xl text-gray-300 mt-4 block'>(무고한 희생 & 유령 미션 실패)</span>"; vicColor = "text-gray-400";
        }

        box.innerHTML = `<div class="flex flex-col items-center anim-reveal-tension"><div class="text-7xl mb-8">⚖️</div><div class="text-5xl font-black ${vicColor} drop-shadow-[0_0_30px_currentColor] bg-black/80 px-16 py-10 border-2 border-white/20 rounded-3xl text-center leading-normal">${vicText}</div></div>`;
      }
      else box.innerHTML = `<div class="text-center bg-black/80 border-2 border-orange-500/60 p-10 rounded-3xl max-w-xl mx-auto shadow-2xl anim-reveal-tension"><h2 class="text-3xl font-black text-orange-400">${st.title}</h2></div>`;
    }

    // ----------------------------------------------------
    // 모바일 뷰
    // ----------------------------------------------------
    function loginMobile() {
      const code = document.getElementById('inputCode').value.trim().toUpperCase();
      const name = document.getElementById('inputName').value.trim();
      if (!appData.cards[code]) return alert('올바르지 않은 코드입니다.');
      if (name.length !== 2) return alert('이름은 성을 제외한 이름 두 글자로만 입력해주세요!\n(예: 홍길동 -> 길동)');
      appData.cards[code].playerName = name; activeMobileCode = code; syncSave();
      document.getElementById('mobileLoginBox').classList.add('hidden'); document.getElementById('mobileCardContent').classList.remove('hidden');
      renderMobileCard();
    }
    
    function renderMobileCard() {
      if (!activeMobileCode) return; const c = appData.cards[activeMobileCode];
      document.getElementById('mobileCardContent').innerHTML = `
        <div class="bg-purple-950/80 p-5 rounded-2xl text-white text-center border border-purple-500/50 shadow-xl">
          <img src="assets/characters/${c.code}.png" onerror="this.style.display='none'" class="w-24 h-24 mx-auto rounded-full mb-3 object-cover border-2 border-purple-400">
          <div class="text-4xl mb-2">${c.charIcon}</div><div class="text-xl font-black">${getDisplayName(c.code)}</div>
          <div class="text-yellow-400 font-bold mt-2">미니게임 점수: <span id="mobileScoreSpan" class="text-2xl">${c.score}</span></div>
          <div class="mt-4 p-4 bg-black/70 rounded-xl border border-red-500/50">
            <div class="${c.isGhost||c.isMadman ? 'text-xl text-red-400' : 'text-base text-orange-300'} font-black animate-pulse mb-3">${c.secretTitle}</div>
            ${c.mission ? `<div class="text-xs text-left bg-red-950/50 p-3 rounded border border-red-500/40 text-red-200 whitespace-pre-wrap leading-relaxed">${c.mission}</div>` : ''}
          </div>
        </div>`;
    }

    function loginVote() {
      const code = document.getElementById('voteInputCode').value.trim().toUpperCase();
      if (!appData.cards[code] || !appData.cards[code].playerName) return alert('유효하지 않은 코드거나 등록되지 않은 참가자입니다.');
      activeVoteCode = code; document.getElementById('voteLoginBox').classList.add('hidden'); document.getElementById('voteFormContent').classList.remove('hidden');
      renderVoteForm();
    }

    function renderVoteForm() {
      const code = activeVoteCode; const c = appData.cards[code];
      const formEl = document.getElementById('voteFormContent');
      const pArr = Object.values(appData.cards).filter(x => x.playerName && x.code !== code && !x.isMadman); 
      const optsG = pArr.map(x => `<option value="${x.code}">${getDisplayName(x.code)}</option>`).join('');
      const allP = Object.values(appData.cards).filter(x => x.playerName && x.code !== code);
      const optsH = allP.map(x => `<option value="${x.code}">${getDisplayName(x.code)}</option>`).join('');
      
      if (c.isGhost) {
        let ghostHtml = `<h3 class="text-lg font-bold text-red-400 mb-3">👻 3가지 약점 수집 보고서</h3>`;
        const phs = ['예: 기생충', '예: 오이', '예: 쫓기는 꿈']; const ths = ['무서운 영화', '싫어하는 음식', '최악의 악몽'];
        for (let i = 1; i <= 3; i++) {
          ghostHtml += `
            <div class="bg-gray-900 border border-red-900 rounded p-3 mb-3">
              <div class="text-sm text-red-300 font-bold mb-1">${i}. ${ths[i-1]}</div>
              <select id="ghostT${i}" class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm mb-2"><option value="">-- 대상 선택 --</option>${optsG}<option value="FAIL">-- 약점 수집 못함 --</option></select>
              <input type="text" id="ghostV${i}" placeholder="약점 내용 입력 (${phs[i-1]})" class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
            </div>`;
        }
        formEl.innerHTML = ghostHtml + `<button onclick="submitVote()" class="w-full py-3 bg-red-700 text-white font-black rounded mt-2 shadow-lg">보고서 제출</button>`;
      } else {
        const mScore = Math.max(...allP.map(x => x.score), c.score);
        const isWinner = c.score === mScore && mScore > 0;
        const voteCount = isWinner ? 3 : 2; 
        
        let selectsHTML = '';
        for(let i=1; i<=voteCount; i++) {
          let extra = i === 3 ? ' (중복 투표 가능)' : (i===2 ? ' (첫 번째와 다른 대상)' : '');
          selectsHTML += `
            <div class="mb-4 bg-red-950/30 border border-red-900 rounded p-3">
              <div class="text-red-300 font-bold text-xs mb-1">[표 ${i}] 의심 대상 선택${extra}</div>
              <select id="voteT${i}" class="vote-target w-full bg-black border border-red-700 rounded p-2 text-white mb-2 shadow-inner"><option value="">-- 대상 선택 --</option>${optsH}</select>
              <textarea id="voteR${i}" class="vote-reason w-full h-16 bg-black border border-red-700 rounded p-2 text-sm text-white" placeholder="의심 사유 기재"></textarea>
            </div>`;
        }

        formEl.innerHTML = `
          <div class="mb-4 text-center border border-red-800 p-3 rounded bg-black/60">
            <span class="text-sm text-gray-300">당신의 투표 권한:</span> <span class="text-2xl font-black text-red-500">${voteCount}장</span>
            ${isWinner ? '<br><span class="text-xs text-yellow-400 font-bold mt-1 inline-block">⭐ 미니게임 우승 혜택 (+1표) 적용!</span>' : ''}
          </div>
          ${selectsHTML}
          ${c.code==='T5780'?'<div class="text-xs text-orange-400 mb-3 text-center">※ 퇴마사의 표는 집계되지 않지만 제출은 필수입니다.</div>':''}
          <button onclick="submitVote()" class="w-full py-3 bg-red-700 text-white font-black rounded shadow-lg text-lg">투표 일괄 제출</button>`;
      }
    }

    function submitVote() {
      const code = activeVoteCode; const c = appData.cards[code];
      if (c.isGhost) {
        let reports = [];
        for(let i=1; i<=3; i++) {
          const t = document.getElementById(`ghostT${i}`).value; const v = document.getElementById(`ghostV${i}`).value;
          if(!t) return alert(`${i}번째 대상을 선택하세요. (실패 시 '약점 수집 못함' 선택)`);
          if(t !== 'FAIL' && !v) return alert(`${i}번째 약점 내용을 입력하세요!`);
          reports.push({ target: t, text: v });
        }
        appData.votes[code] = { isGhostReport: true, reports };
      } else {
        const tEls = document.querySelectorAll('.vote-target'); const rEls = document.querySelectorAll('.vote-reason');
        let targets = []; let reasons = [];
        for(let i=0; i<tEls.length; i++) {
          if(!tEls[i].value || !rEls[i].value.trim()) return alert(`[표 ${i+1}]의 대상과 사유를 모두 입력해주세요!`);
          targets.push(tEls[i].value); reasons.push(rEls[i].value.trim());
        }
        if (targets[0] === targets[1]) return alert('[표 1]과 [표 2]는 서로 다른 사람에게 투표해야 합니다!');
        appData.votes[code] = { targets, reasons };
      }
      syncSave(); alert('제출 완료!'); document.getElementById('voteFormContent').innerHTML = `<div class="text-center text-gray-400 py-10 font-bold text-lg">제출이 완료되었습니다.<br><br>진실의 시간이 다가옵니다...</div>`;
    }

    // ----------------------------------------------------
    // 어드민 컨트롤
    // ----------------------------------------------------
    function changeVolume(val) { appData.config.vol = val; syncSave(); }
    function toggleMute() { appData.config.mute = !appData.config.mute; syncSave(); }
    function prevStage() { if (appData.state.stageIdx > 0) { appData.state.stageIdx--; syncSave(); } }
    function nextStage() { if (appData.state.stageIdx < STAGES.length - 1) { appData.state.stageIdx++; syncSave(); } }
    function jumpToStage(idx) { appData.state.stageIdx = idx; syncSave(); }
    function changeMg1Q(d) { let n = appData.mg1.qIdx + d; if(n<0) n=0; if(n>=MG1_DATA.length) n=MG1_DATA.length-1; appData.mg1.qIdx=n; appData.mg1.showA=false; syncSave(); }
    function toggleMg1A() { appData.mg1.showA = !appData.mg1.showA; syncSave(); }
    function modifyScore(code, d) { if(appData.cards[code]) { appData.cards[code].score = Math.max(0, appData.cards[code].score + d); syncSave(); } }
    function resetVotes() { if(confirm('투표 내역을 초기화합니까?')) { appData.votes = {}; syncSave(); } }
    function hardResetPlayers() { if(prompt('전체 초기화 비번:') !== ADMIN_PIN) return; appData.cards = JSON.parse(JSON.stringify(INITIAL_CARDS)); appData.votes = {}; appData.state.stageIdx = 0; syncSave(); }
    function updatePlayerName(code, newName) { appData.cards[code].playerName = newName; syncSave(); }

    function renderAdminRemote() {
      const st = STAGES[appData.state.stageIdx] || STAGES[0];
      const lbl = document.getElementById('remoteCurrentStageLabel'); if(lbl) lbl.innerText = st.title;
      const listEl = document.getElementById('remoteStageList');
      if(listEl) listEl.innerHTML = STAGES.map((s, i) => `<button onclick="jumpToStage(${i})" class="p-1.5 rounded border text-left truncate ${i === appData.state.stageIdx ? 'bg-orange-600 border-orange-400 text-white font-bold' : 'bg-gray-900 border-gray-800 text-gray-400'}">${s.title}</button>`).join('');

      const scoreBoard = document.getElementById('adminScoreBoard');
      if(scoreBoard) scoreBoard.innerHTML = Object.values(appData.cards).map(c => `<div class="flex items-center justify-between bg-gray-800 rounded px-2 py-1 text-xs text-white"><div class="truncate w-24">${c.charIcon} ${getDisplayName(c.code)}</div><div class="font-black text-yellow-400 w-6 text-center">${c.score}</div><div class="flex gap-1"><button onclick="modifyScore('${c.code}', -1)" class="bg-red-700 px-2 py-1 rounded">-1</button><button onclick="modifyScore('${c.code}', 1)" class="bg-blue-600 px-2 py-1 rounded">+1</button></div></div>`).join('');
      
      const vRes = getVoteResults();
      const vRankEl = document.getElementById('adminVoteRanking');
      if(vRankEl) {
        vRankEl.innerHTML = vRes.sortedAll.filter(x => appData.cards[x[0]].playerName).map((x, i) => {
          let cCode = x[0]; let vCount = x[1]; let invCount = vRes.invalidCounts[cCode] || 0; let tot = vCount + invCount;
          return `<div class="flex justify-between bg-gray-800 border border-gray-600 p-1.5 rounded">
            <span class="font-bold text-white">${i+1}위. ${getDisplayName(cCode)}</span>
            <span class="text-orange-300">유효 ${vCount} / 전체 ${tot} (무효 ${invCount})</span>
          </div>`;
        }).join('');
      }

      const vStatus = document.getElementById('adminVoteStatus');
      if(vStatus) {
        vStatus.innerHTML = Object.values(appData.cards).filter(c=>c.playerName).map(c => {
          const v = appData.votes[c.code];
          let content = `<span class="text-gray-500">⏳ 제출 대기중</span>`;
          if (v) {
            if (v.isGhostReport) {
              const rTxt = v.reports.map(r=>`[${r.target==='FAIL'?'실패':(appData.cards[r.target]?appData.cards[r.target].charName:'?')}] ${r.text||''}`).join(' / ');
              content = `<span class="text-purple-400 break-all text-[8px] leading-tight">보고: ${rTxt}</span>`;
            } else {
              let tTxt = v.targets.map((t,i) => `(${i+1})${appData.cards[t]?appData.cards[t].charName:'?'} [${v.reasons[i]}]`).join(' / ');
              content = `<span class="text-green-300 break-all text-[9px] leading-tight">선택: ${tTxt}</span>`;
            }
          }
          return `<div class="bg-gray-900 p-2 rounded border border-gray-700 flex flex-col gap-1">
            <span class="font-bold text-gray-300">${c.charName}(${c.playerName})</span>${content}
          </div>`;
        }).join('');
      }

      const pMgmt = document.getElementById('adminPlayerMgmt');
      if(pMgmt) pMgmt.innerHTML = Object.values(appData.cards).map(c => `
        <div class="flex items-center gap-2 bg-gray-900 rounded p-1.5 border border-gray-700">
          <span class="w-12 truncate text-gray-400">${c.charIcon} ${c.charName}</span>
          <input type="text" value="${c.playerName}" onchange="updatePlayerName('${c.code}', this.value)" placeholder="미등록" class="flex-1 bg-black border border-gray-600 text-white px-1 py-0.5 rounded">
        </div>`).join('');

      const qLabel = document.getElementById('adminMg1QNum');
      if(qLabel) qLabel.innerText = appData.mg1.qIdx === 0 ? "연습문제" : `${appData.mg1.qIdx}번 문제`;
    }

    if (!window.location.hash) window.location.hash = 'tv'; else routeView();
  </script>
</body>
</html>
