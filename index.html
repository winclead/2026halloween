<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALLOWEEN 2026: SURVIVAL GAME SYSTEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Firebase 실시간 동기화 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #040208; color: #f3f4f6; overflow-x: hidden; }
    .font-gothic { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col" id="bodyRoot">

  <!-- =========================================================
       VIEW 1: 📺 거실 TV 전광판 화면 (#tv)
  ========================================================== -->
  <main id="view-tv" class="hidden flex-1 flex flex-col justify-between relative overflow-hidden bg-black min-h-screen">
    <div class="absolute inset-0 z-0 overflow-hidden bg-black flex items-center justify-center">
      <video id="tvBackgroundVideo" autoplay loop muted playsinline class="w-full h-full object-cover opacity-90">
        <source src="assets/video/bg_ambient.webm" type="video/webm">
        <source src="video/bg_ambient.webm" type="video/webm">
        브라우저가 비디오 태그를 지원하지 않습니다.
      </video>
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/60 pointer-events-none"></div>
    </div>

    <div id="tvTopHeader" class="flex items-center justify-between px-8 py-4 border-b border-white/10 z-10 bg-black/50 backdrop-blur-sm">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🕯️</span>
        <div>
          <div class="text-[10px] text-orange-400 font-bold tracking-widest uppercase">LIVING ROOM LOUNGE</div>
          <h1 class="text-lg md:text-xl font-black text-white" id="tvStageTitleText">평온한 저택</h1>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleMediaPlay()" id="mediaPlayBtn" class="text-xs font-black text-emerald-400 px-3 py-1 bg-emerald-950/80 rounded-xl border border-emerald-500/40 pointer-events-auto">
          ⏹ STOP
        </button>
        <div class="bg-red-950/80 border border-red-500/60 rounded-2xl px-3 py-1 text-center shadow-lg">
          <div class="text-[9px] text-red-300 font-bold">⏰ 심판까지</div>
          <div class="text-xs md:text-sm font-black text-red-400 font-gothic" id="tvCountdownTimer">00:00:00</div>
        </div>
        <div class="bg-black/70 border border-white/20 rounded-2xl px-3 py-1 text-right">
          <div class="text-[9px] text-gray-400">현재 시각</div>
          <div class="text-sm font-black font-gothic text-orange-400" id="tvRealtimeClock">18:00:00</div>
        </div>
      </div>
    </div>

    <div id="tvStageContainer" class="my-auto py-8 px-8 z-10 flex-1 flex items-center justify-center w-full"></div>

    <div id="tvFooterBar" class="px-8 py-3 border-t border-white/10 flex items-center justify-between text-xs text-gray-400 z-10 bg-black/60 backdrop-blur-sm">
      <div>🕯️ 호스트 마스터 리모컨으로 제어됩니다.</div>
      <div class="text-orange-300 font-bold">HALLOWEEN SURVIVAL GAME 2026</div>
    </div>
  </main>

  <!-- =========================================================
       VIEW 2: 📱 참가자 스마트폰 화면 (#mobile)
  ========================================================== -->
  <main id="view-mobile" class="hidden flex-1 py-6 px-4 flex justify-center items-start bg-[#06040a]">
    <div class="w-full max-w-md bg-[#130e21] border-2 border-purple-500/40 rounded-3xl overflow-hidden shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-purple-500/30 pb-3">
        <h2 class="text-base font-black text-white">참가자 지령서 & 투표소</h2>
        <button onclick="logoutMobile()" id="btnMobileLogout" class="hidden text-xs px-2.5 py-1 bg-gray-800 rounded-lg text-gray-300 font-bold">로그아웃</button>
      </div>
      <div id="mobileLoginBox" class="space-y-3">
        <input id="inputCode" type="text" placeholder="비밀 코드 입력 (예: T5780)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white font-black uppercase text-center text-sm">
        <input id="inputName" type="text" maxlength="4" placeholder="실명 세 글자" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white font-bold text-center text-sm">
        <button onclick="loginMobile()" class="w-full py-3 bg-orange-600 hover:bg-orange-500 text-white font-black rounded-xl text-sm">정체 확인하기</button>
      </div>
      <div id="mobileCardContent" class="hidden space-y-3"></div>
    </div>
  </main>

  <!-- =========================================================
       VIEW 3: 🛠️ 호스트 GM 리모컨 화면 (#admin)
  ========================================================== -->
  <main id="view-admin" class="hidden flex-1 py-4 px-3 flex justify-center items-start bg-[#050308]">
    <div class="w-full max-w-lg bg-[#120d1d] border-2 border-orange-500/50 rounded-3xl p-4 space-y-4 shadow-2xl">
      <div class="bg-orange-950/60 border border-orange-500/40 rounded-2xl p-3 space-y-2">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-black text-white">📱 GM 리모컨 (TV 조종 패널)</h2>
          <button onclick="seedAllDemoPlayers()" class="px-2 py-1 bg-emerald-700 text-white rounded text-[11px] font-bold">테스트 5명 등록</button>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="prevStage()" class="py-2 bg-gray-800 text-white font-black rounded-xl text-xs">◀ 이전</button>
          <button onclick="undoLastAction()" class="py-2 bg-amber-900 text-amber-200 font-black rounded-xl text-xs">↩ Undo</button>
          <button onclick="nextStage()" class="py-2 bg-orange-600 text-white font-black rounded-xl text-xs">다음 ▶</button>
        </div>
        <div class="text-[11px] text-center text-orange-200 font-bold bg-black/40 py-1 rounded-lg" id="remoteCurrentStageLabel">현재 화면</div>
      </div>
      <div class="bg-[#161024] border border-gray-800 rounded-2xl p-3 space-y-2">
        <h3 class="text-xs font-black text-orange-400">⏱️ 화면 바로가기</h3>
        <div id="remoteStageList" class="grid grid-cols-2 gap-1.5 text-xs"></div>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      databaseURL: "https://halloween-2026-sync-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_PIN = "261031";

    const STAGES = [
      { id: 'STAGE_REST_6PM',    time: '18:00', title: '평온한 저택 라운지' },
      { id: 'STAGE_STORY_INTRO', time: '19:00', title: '오프닝 & 저주의 스토리텔링' },
      { id: 'STAGE_QR_GUIDE',    time: '19:15', title: '지령서 확인 및 스마트폰 코드 등록' },
      { id: 'STAGE_PARTY_ROOM',  time: '19:30', title: '할로윈 나이트 — 결계 가동 중' },
      { id: 'STAGE_GAME_8PM',    time: '20:00', title: '8시 미니게임' },
      { id: 'STAGE_GAME_9PM',    time: '21:00', title: '9시 미니게임' },
      { id: 'STAGE_VOTE_10PM',   time: '22:00', title: '10시 최후의 심판 — 투표' },
      { id: 'STAGE_VOTE_RESULT', time: '22:15', title: '처형대 결과 발표' },
      { id: 'STAGE_MISSION_OPEN',time: '22:30', title: '진실의 방 — 결과 오픈' }
    ];

    const INITIAL_CARDS = {
      'N3611': { code: 'N3611', charIcon: '🐺', charName: '늑대인간', charDesc: '유령 역할입니다.', secretTitle: '👻 정체: [유령]', playerName: '', score: 0, bonusVotes: 0, votedFor: '' },
      'G7420': { code: 'G7420', charIcon: '🎭', charName: '광대', charDesc: '미치광이 역할입니다.', secretTitle: '🤪 정체: [미치광이]', playerName: '', score: 0, bonusVotes: 0, votedFor: '' },
      'T5780': { code: 'T5780', charIcon: '✝️', charName: '퇴마사', charDesc: '인간 생존자입니다.', secretTitle: '🎃 정체: [인간]', playerName: '', score: 0, bonusVotes: 0, votedFor: '' }
    };

    let appData = {
      state: { stageIdx: 0 },
      cards: JSON.parse(JSON.stringify(INITIAL_CARDS))
    };

    let historyStack = [];
    let activeMobileCode = null;

    // Firebase 실시간 리스너 (데이터가 없으면 초기값 자동 세팅)
    db.ref('halloween_state').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        appData = data;
      } else {
        db.ref('halloween_state').set(appData);
      }
      renderAll();
    });

    function syncSave() {
      db.ref('halloween_state').set(appData);
    }

    function routeView() {
      const hash = window.location.hash.replace('#', '') || 'tv';
      if (hash === 'admin') {
        const pin = prompt('🛠️ GM 비밀번호 입력 (261031):');
        if (pin !== ADMIN_PIN) { alert('비밀번호가 틀렸습니다!'); window.location.hash = 'tv'; return; }
      }
      switchView(hash);
    }

    window.addEventListener('hashchange', routeView);

    function switchView(view) {
      ['tv', 'mobile', 'admin'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if(el) el.classList.add('hidden');
      });
      const target = document.getElementById(`view-${view}`);
      if (target) target.classList.remove('hidden');
      renderAll();
    }

    function saveHistory() {
      historyStack.push(JSON.parse(JSON.stringify(appData)));
      if (historyStack.length > 20) historyStack.shift();
    }

    function prevStage() { 
      if (appData.state.stageIdx > 0) { 
        saveHistory(); 
        appData.state.stageIdx--; 
        syncSave(); 
      } 
    }
    
    function nextStage() { 
      if (appData.state.stageIdx < STAGES.length - 1) { 
        saveHistory(); 
        appData.state.stageIdx++; 
        syncSave(); 
      } 
    }
    
    function jumpToStage(idx) { 
      saveHistory(); 
      appData.state.stageIdx = idx; 
      syncSave(); 
    }

    function toggleMediaPlay() {
      const vid = document.getElementById('tvBackgroundVideo');
      const btn = document.getElementById('mediaPlayBtn');
      if (!vid) return;
      if (vid.paused) {
        vid.play();
        btn.innerText = "⏹ STOP";
      } else {
        vid.pause();
        btn.innerText = "▶ PLAY";
      }
    }

    function renderTV() {
      const st = STAGES[appData.state.stageIdx] || STAGES[0];
      const topHeader = document.getElementById('tvTopHeader');
      const footerBar = document.getElementById('tvFooterBar');

      if (st.id === 'STAGE_REST_6PM') {
        if(topHeader) topHeader.style.display = 'none';
        if(footerBar) footerBar.style.display = 'none';
      } else {
        if(topHeader) topHeader.style.display = 'flex';
        if(footerBar) footerBar.style.display = 'flex';
        const titleEl = document.getElementById('tvStageTitleText');
        if(titleEl) titleEl.innerText = st.title;
      }

      const box = document.getElementById('tvStageContainer');
      if(!box) return;

      if (st.id === 'STAGE_REST_6PM') {
        box.innerHTML = `<div class="absolute top-4 left-6 text-white/30 text-xs font-bold pointer-events-none">🎶 Ambient Background Playing</div>`;
      } else if (st.id === 'STAGE_STORY_INTRO') {
        box.innerHTML = `<div class="text-center space-y-4 bg-black/80 border border-red-500/50 p-8 rounded-3xl max-w-2xl mx-auto backdrop-blur-md"><h2 class="text-3xl font-black text-red-400">할로윈 게임에 오신 것을 환영합니다</h2><p class="text-sm text-gray-300">저택에 숨은 유령을 찾아내십시오.</p></div>`;
      } else if (st.id === 'STAGE_QR_GUIDE') {
        const url = window.location.href.split('#')[0] + '#mobile';
        box.innerHTML = `<div class="text-center space-y-4 bg-black/85 border border-purple-500/50 p-8 rounded-3xl max-w-xl mx-auto backdrop-blur-md"><h3 class="text-xl font-black text-white">스마트폰으로 참여하세요</h3><div id="qrBox" class="inline-block bg-white p-3 rounded-xl"></div></div>`;
        setTimeout(() => { const q = document.getElementById('qrBox'); if (q && q.innerHTML === '') new QRCode(q, { text: url, width: 140, height: 140 }); }, 100);
      } else {
        box.innerHTML = `<div class="text-center bg-black/70 border border-white/20 p-8 rounded-3xl max-w-xl mx-auto backdrop-blur-md"><h2 class="text-2xl font-black text-orange-400">${st.title}</h2></div>`;
      }
    }

    function loginMobile() {
      const code = document.getElementById('inputCode').value.trim().toUpperCase();
      const name = document.getElementById('inputName').value.trim();
      if (!appData.cards[code]) { alert('코드가 올바르지 않습니다.'); return; }
      appData.cards[code].playerName = name;
      activeMobileCode = code;
      syncSave();
      document.getElementById('mobileLoginBox').classList.add('hidden');
      document.getElementById('mobileCardContent').classList.remove('hidden');
      document.getElementById('btnMobileLogout').classList.remove('hidden');
      renderMobileCard();
    }
    
    function logoutMobile() {
      activeMobileCode = null;
      document.getElementById('mobileLoginBox').classList.remove('hidden');
      document.getElementById('mobileCardContent').classList.add('hidden');
      document.getElementById('btnMobileLogout').classList.add('hidden');
    }
    
    function renderMobileCard() {
      if (!activeMobileCode) return;
      const c = appData.cards[activeMobileCode];
      const cardEl = document.getElementById('mobileCardContent');
      if(cardEl) cardEl.innerHTML = `<div class="bg-purple-950 p-4 rounded-xl text-white font-bold">${c.charIcon} ${c.playerName} (${c.charName})<br><span class="text-xs text-orange-300">${c.secretTitle}</span></div>`;
    }

    function renderAdminRemote() {
      const st = STAGES[appData.state.stageIdx] || STAGES[0];
      const lbl = document.getElementById('remoteCurrentStageLabel');
      if(lbl) lbl.innerText = `현재 화면: ${st.title}`;
      
      const listEl = document.getElementById('remoteStageList');
      if(listEl) {
        listEl.innerHTML = STAGES.map((s, idx) => `
          <button onclick="jumpToStage(${idx})" class="p-2 rounded border text-left ${idx === appData.state.stageIdx ? 'bg-orange-600 text-white font-black' : 'bg-gray-900 text-gray-300'}">
            <div class="text-[9px] opacity-75">${s.time}</div><div class="truncate">${s.title}</div>
          </button>
        `).join('');
      }
    }

    function seedAllDemoPlayers() {
      saveHistory();
      appData.cards['N3611'].playerName = '박유령';
      appData.cards['G7420'].playerName = '최광기';
      appData.cards['T5780'].playerName = '김인간';
      syncSave();
      alert('테스트 플레이어 등록 완료!');
    }

    function renderAll() {
      const hash = window.location.hash.replace('#', '') || 'tv';
      if (hash === 'tv') renderTV();
      if (hash === 'admin') renderAdminRemote();
      if (hash === 'mobile' && activeMobileCode) renderMobileCard();
    }

    if (!window.location.hash) {
      window.location.hash = 'tv';
    } else {
      routeView();
    }
  </script>
</body>
</html>
