  <script>
    // ----------------------------------------------------
    // 1. Firebase 및 기본 설정
    // ----------------------------------------------------
    firebase.initializeApp({ databaseURL: "https://halloween-2026-1407e-default-rtdb.firebaseio.com/" });
    const db = firebase.database();
    const ADMIN_PIN = "261031";
    const VID_OPENING = "Yqp_2etisLk"; const VID_BGM = "TkEzDC1BeMU"; const VID_JUDGE = "Yqp_2etisLk";

    const STAGES = [
      { id: 'STAGE_REST_6PM',       title: '[대기] 평온한 저택 라운지', vid: VID_BGM },
      { id: 'STAGE_STORY_INTRO',    title: '[오프닝] 오프닝 & 저주의 시작', vid: VID_OPENING },
      { id: 'STAGE_QR_GUIDE',       title: '[접속] 스마트폰 지령서 안내', vid: VID_BGM },
      { id: 'STAGE_PARTY_ROOM',     title: '[파티] 할로윈 나이트 파티', vid: VID_BGM },
      
      { id: 'STAGE_GAME1_READY',    title: '[미니게임] 준비 화면', vid: VID_BGM, sound: 'bell' },
      { id: 'STAGE_GAME1_PLAY',     title: '[미니게임] 문제 진행 & 점수판', vid: VID_BGM },
      { id: 'STAGE_GAME1_WIN',      title: '[미니게임] 우승자 발표', vid: VID_BGM },
      
      { id: 'STAGE_VOTE_10PM',      title: '[심판] 10시 최후의 심판 (영상)', vid: VID_JUDGE },
      { id: 'STAGE_VOTE_QR',        title: '[투표] 투표/미션보고 접속QR', vid: VID_BGM },
      
      { id: 'STAGE_VOTE_RESULT_1',  title: '[결과 1] 최다 득표 1, 2위 발표', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_2',  title: '[결과 2] 1, 2위 정체 공개', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_3',  title: '[결과 3] 유령 미션 보고서 공개', vid: VID_BGM },
      { id: 'STAGE_VOTE_RESULT_4',  title: '[엔딩] 최종 진영 승패 확정', vid: VID_BGM }
    ];

    const MG1_DATA = [
      { q: '할로윈퀴즈0.png', a: '0_도깨비.jpg', title: '도깨비 (연습문제)' },
      { q: '할로윈퀴즈1.png', a: '1_기생충.jpg', title: '기생충' },
      { q: '할로윈퀴즈2.png', a: '2_오디세이.jpg', title: '오디세이' },
      { q: '할로윈퀴즈3.png', a: '3_어벤져스.jpg', title: '어벤져스' },
      { q: '할로윈퀴즈4.png', a: '4_겨울왕국2.jpg', title: '겨울왕국 2' },
      { q: '할로윈퀴즈5.png', a: '5_인터스텔라.jpg', title: '인터스텔라' },
      { q: '할로윈퀴즈6.png', a: '6_말할수없는비밀.jpg', title: '말할 수 없는 비밀' },
      { q: '할로윈퀴즈7.png', a: '7_명량.jpg', title: '명량' },
      { q: '할로윈퀴즈8.png', a: '8_택시운전사.jpg', title: '택시운전사' },
      { q: '할로윈퀴즈9.png', a: '9_나우유씨미.jpg', title: '나우 유 씨 미' },
      { q: '할로윈퀴즈10.png', a: '10_폭싹속았수다.jpg', title: '폭싹 속았수다' },
      { q: '할로윈퀴즈11.png', a: '11_꽃보다남자.jpg', title: '꽃보다 남자' }
    ];

    const INITIAL_CARDS = {
      'W3611': { code: 'W3611', charIcon: '🐺', charName: '늑대인간', playerName: '', score: 0,
        story: '보름달이 뜨면 감각이 예민해지는 은빛 늑대인간입니다.', secretTitle: '👻 [진짜 정체: 유령]',
        mission: '※ 조력자: 🔮 마녀(M7420)\n[미션: 서로 다른 3명의, 서로 다른 약점 알아내기!]\n(조건: 가장 무섭게 본 영화, 가장 싫어하는 음식, 꿔봤던 악몽)\nex) 퇴마사 무서운영화 + 강시 악몽 + 사신 싫어하는음식\n🚨 캡처 필수!', isGhost: true },
      'M7420': { code: 'M7420', charIcon: '🔮', charName: '마녀', playerName: '', score: 0,
        story: '비밀스러운 약초와 저주를 다루는 숲속의 마녀입니다.', secretTitle: '🤪 [진짜 정체: 미치광이]',
        mission: '※ 당신은 유령이 누구인지 모릅니다!\n[미션: 유령 대신 당신이 의심을 받아 처형대에 올라가면 단독 승리합니다!] (캡처 필수)', isMadman: true },
      'T5780': { code: 'T5780', charIcon: '✝️', charName: '퇴마사', playerName: '', score: 0, story: '성수와 십자가로 악령을 쫓는 인간 퇴마사입니다.', secretTitle: '🎃 [정체: 인간 생존자]' },
      'K2491': { code: 'K2491', charIcon: '🧟', charName: '강시', playerName: '', score: 0, story: '부적이 붙은 강시입니다.', secretTitle: '📜 [정체: 인간 생존자 (페이크 몬스터)]' },
      'B8312': { code: 'B8312', charIcon: '🧛', charName: '뱀파이어', playerName: '', score: 0, story: '고풍스러운 뱀파이어입니다.', secretTitle: '🍷 [정체: 인간 생존자 (페이크 몬스터)]' },
      'Z9154': { code: 'Z9154', charIcon: '💀', charName: '좀비', playerName: '', score: 0, story: '탈출한 좀비 분장 생존자입니다.', secretTitle: '⛓️ [정체: 인간 생존자 (페이크 몬스터)]' },
      'S4823': { code: 'S4823', charIcon: '⏳', charName: '사신', playerName: '', score: 0, story: '사신 코스프레 생존자입니다.', secretTitle: '🖤 [정체: 인간 생존자 (페이크 몬스터)]' }
    };

    let appData = { state: { stageIdx: 0 }, config: { vol: 100, mute: false }, mg1: { qIdx: 0, showA: false }, cards: JSON.parse(JSON.stringify(INITIAL_CARDS)), votes: {} };
    let activeMobileCode = null; let activeVoteCode = null; let ytPlayer = null; let tvAudioInited = false; let currentStageForSound = -1;

    // ----------------------------------------------------
    // 2. YouTube & Firebase
    // ----------------------------------------------------
    function onYouTubeIframeAPIReady() { ytPlayer = new YT.Player('tvYoutubeBg', { videoId: VID_BGM, playerVars: { 'autoplay': 1, 'controls': 0, 'mute': 1, 'loop': 1, 'playlist': VID_BGM } }); }
    function initTVAudio() { tvAudioInited = true; document.getElementById('tvStartOverlay').style.display = 'none'; if(ytPlayer && ytPlayer.unMute) ytPlayer.unMute(); renderTV(); }
    db.ref('halloween_state_v7').on('value', (snap) => {
      if (snap.val()) { appData = snap.val(); if(!appData.votes) appData.votes={}; if(!appData.mg1) appData.mg1={qIdx:0,showA:false}; }
      else db.ref('halloween_state_v7').set(appData);
      renderAll();
    });
    function syncSave() { db.ref('halloween_state_v7').set(appData); }
    setInterval(() => { const c = document.getElementById('tvRealtimeClock'); if(c) c.innerText = new Date().toLocaleTimeString('ko-KR', {hour12:false}); }, 1000);
    window.addEventListener('hashchange', routeView);
    function routeView() {
      const hash = window.location.hash.replace('#', '') || 'tv';
      if (hash === 'admin' && prompt('🛠️ GM 비밀번호 입력 (261031):') !== ADMIN_PIN) { window.location.hash = 'tv'; return; }
      ['tv', 'mobile', 'admin', 'vote'].forEach(v => { const el = document.getElementById(`view-${v}`); if(el) el.classList.toggle('hidden', v !== hash); });
      renderAll();
    }
    function getDisplayName(code) { const c = appData.cards[code]; return c && c.playerName ? `${c.charName}(${c.playerName})` : (c ? c.charName : '알수없음'); }

    // 투표 집계 함수 (TV 렌더링에 공통 사용)
    function getVoteResults() {
      let voteCounts = {};
      Object.keys(appData.votes).forEach(voter => {
        if (voter === 'W3611' || voter === 'T5780') return; // 유령, 퇴마사 표는 무효
        const v = appData.votes[voter];
        if (v.targets) v.targets.forEach(t => { if(t) voteCounts[t] = (voteCounts[t]||0) + 1; });
      });
      const sorted = Object.entries(voteCounts).sort((a,b)=>b[1]-a[1]);
      return { 
        top1: sorted.length > 0 ? sorted[0] : null,
        top2: sorted.length > 1 ? sorted[1] : null,
        isGhostExecuted: sorted.length > 0 && (sorted[0][0] === 'W3611' || (sorted.length > 1 && sorted[0][1] === sorted[1][1] && sorted[1][0] === 'W3611')),
        isMadmanExecuted: sorted.length > 0 && (sorted[0][0] === 'M7420' || (sorted.length > 1 && sorted[0][1] === sorted[1][1] && sorted[1][0] === 'M7420'))
      };
    }

    // ----------------------------------------------------
    // 3. TV 렌더링
    // ----------------------------------------------------
    function renderTV() {
      const st = STAGES[appData.state.stageIdx] || STAGES[0];
      if (tvAudioInited && ytPlayer && ytPlayer.getVideoData && ytPlayer.getVideoData().video_id !== st.vid) ytPlayer.loadVideoById({videoId: st.vid});
      if (tvAudioInited && st.sound === 'bell' && currentStageForSound !== appData.state.stageIdx) {
        currentStageForSound = appData.state.stageIdx;
        const bell = document.getElementById('bellSound'); bell.currentTime = 0; let pc = 1;
        bell.onended = () => { if(pc < 2) { pc++; bell.currentTime = 0; bell.play().catch(()=>{}); } else bell.onended = null; };
        bell.play().catch(()=>{});
      }

      document.getElementById('tvTopHeader').classList.toggle('hidden', st.id === 'STAGE_REST_6PM' || st.id === 'STAGE_VOTE_10PM');
      document.getElementById('tvFooterBar').classList.toggle('hidden', st.id === 'STAGE_REST_6PM' || st.id === 'STAGE_VOTE_10PM');
      document.getElementById('tvStageTitleText').innerText = st.title;
      const box = document.getElementById('tvStageContainer'); const urlBase = window.location.href.split('#')[0];

      if (st.id === 'STAGE_REST_6PM' || st.id === 'STAGE_VOTE_10PM') box.innerHTML = '';
      else if (st.id === 'STAGE_QR_GUIDE' || st.id === 'STAGE_VOTE_QR') {
        const isVote = st.id === 'STAGE_VOTE_QR';
        box.innerHTML = `<div class="text-center bg-black/85 border-2 ${isVote?'border-red-600':'border-purple-500'} p-10 rounded-3xl shadow-2xl"><h3 class="text-2xl font-bold ${isVote?'text-red-500':'text-white'} mb-6">${isVote?'⚖️ 진실의 제단 접속 QR':'지령서 수신 QR 코드'}</h3><div id="qrBoxTv" class="inline-block bg-white p-3 rounded-xl"></div></div>`;
        setTimeout(() => { const q = document.getElementById('qrBoxTv'); if(q && !q.innerHTML) new QRCode(q, {text: urlBase+(isVote?'#vote':'#mobile'), width:250, height:250}); }, 100);
      }
      else if (st.id === 'STAGE_GAME1_READY') {
        box.innerHTML = `<div class="text-center anim-reveal-tension"><h1 class="text-6xl font-black text-red-500 drop-shadow-[0_0_20px_rgba(220,38,38,0.8)] mb-4 font-gothic">어둠으로 덮인 포스터</h1><p class="text-2xl text-gray-300">어둠 속에 묻힌 진실을 찾아라...</p></div>`;
      }
      else if (st.id === 'STAGE_GAME1_PLAY') {
        const qData = MG1_DATA[appData.mg1.qIdx]; const isAns = appData.mg1.showA;
        const players = Object.values(appData.cards).filter(c => c.playerName);
        const scoreCards = players.map(c => `<div class="bg-gray-900/90 border border-gray-600 rounded-xl p-2 text-center flex flex-col items-center justify-center"><div class="text-2xl">${c.charIcon}</div><div class="text-white font-bold text-xs truncate w-full">${getDisplayName(c.code)}</div><div class="text-2xl font-black text-orange-400">${c.score}</div></div>`).join('');
        box.innerHTML = `
          <div class="flex flex-col md:flex-row w-full max-w-6xl gap-6 items-center justify-center h-full">
            <div class="flex-1 flex flex-col items-center bg-black/80 p-4 rounded-3xl border ${isAns ? 'border-green-500' : 'border-white/20'}">
              <h2 class="text-xl font-bold text-yellow-400 mb-3">🎬 영화/드라마 맞추기</h2>
              <img src="assets/posters/${isAns ? qData.a : qData.q}" class="max-h-[50vh] object-contain rounded-xl shadow-lg">
              ${isAns ? `<h3 class="text-3xl font-black mt-4 text-green-400 drop-shadow-md">정답: ${qData.title}</h3>` : '<div class="h-10 mt-4"></div>'}
            </div>
            <div class="w-full md:w-1/3 bg-black/60 p-4 rounded-3xl border border-gray-700 h-full flex flex-col justify-center">
              <h3 class="text-xl font-black text-center text-white mb-4">현재 점수판</h3>
              <div class="grid grid-cols-2 gap-3">${scoreCards}</div>
            </div>
          </div>`;
      }
      else if (st.id === 'STAGE_GAME1_WIN') {
        const players = Object.values(appData.cards).filter(c => c.playerName);
        const mScore = Math.max(...players.map(c => c.score), 0);
        const winners = mScore > 0 ? players.filter(c => c.score === mScore) : [];
        if(winners.length === 0) box.innerHTML = `<h2 class="text-4xl text-gray-400">아무도 점수를 얻지 못했습니다.</h2>`;
        else box.innerHTML = `<h2 class="text-4xl font-black text-yellow-400 mb-2 drop-shadow-lg">🎉 미니게임 1 우승자 🎉</h2><div class="text-lg text-yellow-200 mb-8">(우승자는 10시 투표에서 총 3표의 권한을 얻습니다!)</div><div class="flex gap-6 justify-center flex-wrap">` + winners.map(w => `<div class="bg-yellow-600/30 border-4 border-yellow-400 rounded-3xl p-6 text-center shadow-[0_0_30px_rgba(250,204,21,0.5)]"><img src="assets/characters/${w.code}.png" onerror="this.style.display='none'" class="h-20 w-20 mx-auto mb-3 rounded-full border-2 border-yellow-400 object-cover"><div class="text-3xl mb-1">${w.charIcon}</div><div class="text-xl font-black text-white">${getDisplayName(w.code)}</div><div class="text-2xl text-yellow-300 mt-1">${w.score}점</div></div>`).join('') + `</div>`;
      }
      else if (st.id === 'STAGE_VOTE_RESULT_1') {
        const res = getVoteResults();
        if(!res.top1) { box.innerHTML = `<h2 class="text-4xl text-gray-400">집계된 유효 투표가 없습니다.</h2>`; return; }
        
        let html = `<h2 class="text-5xl font-black text-red-500 mb-10 drop-shadow-lg">⛓️ 처형대 최다 득표자</h2><div class="flex gap-8 justify-center anim-reveal-tension">`;
        html += `<div class="bg-red-900/60 border-4 border-red-500 rounded-3xl p-8 text-center shadow-[0_0_30px_rgba(220,38,38,0.6)] relative"><div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-red-600 text-white font-bold px-4 py-1 rounded-full text-lg">1위 (${res.top1[1]}표)</div><img src="assets/characters/${res.top1[0]}.png" onerror="this.style.display='none'" class="h-32 w-32 mx-auto mb-4 rounded-full border-2 border-red-400 object-cover"><div class="text-5xl mb-2">${appData.cards[res.top1[0]].charIcon}</div><div class="text-4xl font-black text-white">${getDisplayName(res.top1[0])}</div></div>`;
        if (res.top2) {
          html += `<div class="bg-gray-800/80 border-4 border-gray-500 rounded-3xl p-8 text-center opacity-80 relative"><div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-gray-600 text-white font-bold px-3 py-1 rounded-full text-sm">2위 (${res.top2[1]}표)</div><img src="assets/characters/${res.top2[0]}.png" onerror="this.style.display='none'" class="h-24 w-24 mx-auto mb-4 rounded-full border-2 border-gray-400 object-cover"><div class="text-4xl mb-2">${appData.cards[res.top2[0]].charIcon}</div><div class="text-2xl font-black text-gray-200">${getDisplayName(res.top2[0])}</div></div>`;
        }
        html += `</div>`; box.innerHTML = html;
      }
      else if (st.id === 'STAGE_VOTE_RESULT_2') {
        const res = getVoteResults();
        if(!res.top1) return box.innerHTML = '';
        
        let t1Card = appData.cards[res.top1[0]];
        let t1Identity = t1Card.isGhost ? "유령 👻" : (t1Card.isMadman ? "미치광이 🤪" : "인간 생존자 🎃");
        
        let html = `<div class="flex flex-col items-center anim-reveal-tension"><h2 class="text-4xl font-black text-white mb-6">최다 득표자의 진짜 정체는...</h2>`;
        html += `<div class="bg-black/80 border-4 border-red-600 p-10 rounded-3xl text-center shadow-[0_0_40px_rgba(220,38,38,0.8)]"><div class="text-6xl mb-4">${t1Card.charIcon}</div><div class="text-4xl font-bold text-white mb-6">${getDisplayName(res.top1[0])}</div><div class="text-5xl font-black text-red-500 animate-pulse bg-red-950/50 px-6 py-3 rounded-2xl">${t1Identity}</div></div>`;
        
        if (t1Card.isGhost) html += `<div class="mt-8 text-3xl text-green-400 font-bold">인간 진영이 유령을 잡아냈습니다!</div>`;
        else if (t1Card.isMadman) html += `<div class="mt-8 text-3xl text-purple-400 font-bold">미치광이가 시선 끌기에 성공했습니다!</div>`;
        else html += `<div class="mt-8 text-3xl text-red-500 font-bold">무고한 인간이 처형되었습니다...</div>`;
        
        box.innerHTML = html + `</div>`;
      }
      else if (st.id === 'STAGE_VOTE_RESULT_3') {
        const ghostV = appData.votes['W3611'];
        box.innerHTML = `<div class="bg-black/90 border-4 border-purple-600 rounded-3xl p-10 max-w-3xl w-full shadow-[0_0_50px_rgba(147,51,234,0.6)] anim-reveal-tension"><h2 class="text-4xl font-black text-purple-400 mb-6 text-center">👻 유령의 미션 보고서</h2><div class="bg-gray-900 border border-purple-800 rounded-xl p-6 text-white text-xl leading-relaxed whitespace-pre-wrap">${ghostV && ghostV.missionText ? ghostV.missionText : '제출된 보고서가 없습니다.'}</div></div>`;
      }
      else if (st.id === 'STAGE_VOTE_RESULT_4') {
        const res = getVoteResults();
        let vicText = ""; let vicColor = "";
        
        if (res.isMadmanExecuted) { vicText = "🤪 미치광이 단독 승리! (인간/유령 패배)"; vicColor = "text-purple-400"; }
        else if (res.isGhostExecuted) { vicText = "🎃 인간 진영 승리! (유령 색출 성공)"; vicColor = "text-green-400"; }
        else { vicText = "👻 유령 진영 승리! (미션 결과에 따라 최종 확정)"; vicColor = "text-red-500"; }

        box.innerHTML = `<div class="flex flex-col items-center anim-reveal-tension"><div class="text-7xl mb-8">⚖️</div><div class="text-6xl font-black ${vicColor} drop-shadow-[0_0_30px_currentColor] bg-black/80 px-10 py-6 border-2 border-white/20 rounded-3xl text-center leading-snug">${vicText}</div></div>`;
      }
      else box.innerHTML = `<div class="text-center bg-black/80 border-2 border-orange-500/60 p-10 rounded-3xl max-w-xl mx-auto shadow-2xl"><h2 class="text-3xl font-black text-orange-400">${st.title}</h2></div>`;
    }

    // ----------------------------------------------------
    // 4. 모바일 지령서 & 투표
    // ----------------------------------------------------
    function loginMobile() {
      const code = document.getElementById('inputCode').value.trim().toUpperCase();
      const name = document.getElementById('inputName').value.trim();
      if (!appData.cards[code]) return alert('올바르지 않은 코드입니다.');
      if (name.length !== 2) return alert('이름은 성을 제외한 이름 두 글자로만 입력해주세요!\n(예: 홍길동 -> 길동)');
      appData.cards[code].playerName = name; activeMobileCode = code; syncSave();
      document.getElementById('mobileLoginBox').classList.add('hidden'); document.getElementById('mobileCardContent').classList.remove('hidden');
      renderMobileCard();
    }
    
    function renderMobileCard() {
      if (!activeMobileCode) return; const c = appData.cards[activeMobileCode];
      document.getElementById('mobileCardContent').innerHTML = `
        <div class="bg-purple-950/80 p-5 rounded-2xl text-white text-center border border-purple-500/50 shadow-xl">
          <img src="assets/characters/${c.code}.png" onerror="this.style.display='none'" class="w-24 h-24 mx-auto rounded-full mb-3 object-cover border-2 border-purple-400">
          <div class="text-4xl mb-2">${c.charIcon}</div><div class="text-xl font-black">${getDisplayName(c.code)}</div>
          <div class="mt-4 p-3 bg-black/60 rounded-xl border border-red-500/50">
            <div class="${c.isGhost||c.isMadman ? 'text-xl text-red-400' : 'text-sm text-orange-300'} font-black animate-pulse">${c.secretTitle}</div>
            ${c.mission ? `<div class="mt-3 text-xs text-left bg-red-950/40 p-3 rounded border border-red-500/30 text-red-200 whitespace-pre-wrap">${c.mission}</div>` : ''}
          </div>
        </div>`;
    }

    function loginVote() {
      const code = document.getElementById('voteInputCode').value.trim().toUpperCase();
      if (!appData.cards[code] || !appData.cards[code].playerName) return alert('유효하지 않은 코드거나 등록되지 않은 참가자입니다.');
      activeVoteCode = code; document.getElementById('voteLoginBox').classList.add('hidden'); document.getElementById('voteFormContent').classList.remove('hidden');
      renderVoteForm();
    }

    function renderVoteForm() {
      const code = activeVoteCode; const c = appData.cards[code];
      const formEl = document.getElementById('voteFormContent');
      
      if (c.isGhost) {
        formEl.innerHTML = `<h3 class="text-lg font-bold text-red-400">👻 유령 약점 수집 보고서</h3><textarea id="ghostMissionInput" class="w-full h-40 bg-gray-900 border border-red-700 rounded p-3 text-sm text-white" placeholder="누구의 어떤 약점을 알아냈는지 3가지를 상세히 적어주세요!"></textarea><button onclick="submitVote()" class="w-full py-3 bg-red-700 text-white font-black rounded mt-3">보고서 제출</button>`;
      } else {
        const pArr = Object.values(appData.cards).filter(x => x.playerName);
        const mScore = Math.max(...pArr.map(x => x.score), 0);
        const isWinner = c.score === mScore && mScore > 0;
        const voteCount = isWinner ? 3 : 2; // 기본 2표, 우승자 3표
        
        const opts = pArr.filter(x => x.code !== code).map(x => `<option value="${x.code}">${getDisplayName(x.code)}</option>`).join('');
        
        let selectsHTML = '';
        for(let i=1; i<=voteCount; i++) {
          selectsHTML += `<select class="vote-target w-full bg-gray-900 border border-red-700 rounded p-3 text-white mb-2"><option value="">-- [표 ${i}] 의심되는 사람 선택 --</option>${opts}</select>`;
        }

        formEl.innerHTML = `
          <div class="mb-3 text-center border border-red-800 p-2 rounded bg-black">
            <span class="text-sm text-gray-300">당신의 행사 가능한 투표권:</span> <span class="text-xl font-black text-red-500">${voteCount}장</span>
            ${isWinner ? '<br><span class="text-xs text-yellow-400">미니게임 우승 혜택 (+1표) 적용!</span>' : ''}
          </div>
          ${selectsHTML}
          ${c.code==='T5780'?'<div class="text-xs text-orange-400 mb-2">※ 퇴마사의 표는 집계되지 않지만 제출은 필수입니다.</div>':''}
          <textarea id="voteReason" class="w-full h-24 bg-gray-900 border border-red-700 rounded p-3 text-sm text-white mt-2" placeholder="의심하는 이유를 적어주세요."></textarea>
          <button onclick="submitVote()" class="w-full py-3 bg-red-700 text-white font-black rounded mt-3">투표 일괄 제출</button>`;
      }
    }

    function submitVote() {
      const code = activeVoteCode; const c = appData.cards[code];
      if (c.isGhost) {
        appData.votes[code] = { isGhostReport: true, missionText: document.getElementById('ghostMissionInput').value };
      } else {
        const els = document.querySelectorAll('.vote-target');
        let targets = [];
        for(let i=0; i<els.length; i++) {
          if(!els[i].value) return alert('모든 투표권을 빠짐없이 행사해주세요!');
          targets.push(els[i].value);
        }
        appData.votes[code] = { targets, reason: document.getElementById('voteReason').value };
      }
      syncSave(); alert('제출 완료!'); document.getElementById('voteFormContent').innerHTML = `<div class="text-center text-gray-400 py-10">제출이 완료되었습니다. TV 화면을 주시하세요.</div>`;
    }

    // ----------------------------------------------------
    // 5. 어드민 컨트롤
    // ----------------------------------------------------
    function prevStage() { if (appData.state.stageIdx > 0) { appData.state.stageIdx--; syncSave(); } }
    function nextStage() { if (appData.state.stageIdx < STAGES.length - 1) { appData.state.stageIdx++; syncSave(); } }
    function jumpToStage(idx) { appData.state.stageIdx = idx; syncSave(); }
    
    function changeMg1Q(delta) {
      let nIdx = appData.mg1.qIdx + delta;
      if(nIdx < 0) nIdx = 0; if(nIdx >= MG1_DATA.length) nIdx = MG1_DATA.length - 1;
      appData.mg1.qIdx = nIdx; appData.mg1.showA = false; syncSave();
    }
    function toggleMg1A() { appData.mg1.showA = !appData.mg1.showA; syncSave(); }
    function modifyScore(code, d) { if(appData.cards[code]) { appData.cards[code].score = Math.max(0, appData.cards[code].score + d); syncSave(); } }
    function resetVotes() { if(confirm('투표 내역을 초기화합니까?')) { appData.votes = {}; syncSave(); } }
    
    function hardResetPlayers() {
      if(prompt('모든 데이터를 초기화합니까? 비번입력:') !== ADMIN_PIN) return alert('취소됨');
      appData.cards = JSON.parse(JSON.stringify(INITIAL_CARDS)); appData.votes = {}; appData.state.stageIdx = 0; syncSave();
    }
    function updatePlayerName(code, newName) { appData.cards[code].playerName = newName; syncSave(); }

    function renderAdminRemote() {
      const st = STAGES[appData.state.stageIdx] || STAGES[0];
      const lbl = document.getElementById('remoteCurrentStageLabel'); if(lbl) lbl.innerText = st.title;
      
      const listEl = document.getElementById('remoteStageList');
      if(listEl) listEl.innerHTML = STAGES.map((s, i) => `<button onclick="jumpToStage(${i})" class="p-1.5 rounded border text-left truncate ${i === appData.state.stageIdx ? 'bg-orange-600 border-orange-400 text-white font-bold' : 'bg-gray-900 border-gray-800 text-gray-400'}">${s.title}</button>`).join('');

      const scoreBoard = document.getElementById('adminScoreBoard');
      if(scoreBoard) scoreBoard.innerHTML = Object.values(appData.cards).map(c => `<div class="flex items-center justify-between bg-gray-800 rounded px-2 py-1 text-xs text-white"><div class="truncate w-24">${c.charIcon} ${getDisplayName(c.code)}</div><div class="font-black text-yellow-400 w-6 text-center">${c.score}</div><div class="flex gap-1"><button onclick="modifyScore('${c.code}', -1)" class="bg-red-700 px-2 py-1 rounded">-1</button><button onclick="modifyScore('${c.code}', 1)" class="bg-blue-600 px-2 py-1 rounded">+1</button></div></div>`).join('');
      
      const vStatus = document.getElementById('adminVoteStatus');
      if(vStatus) {
        vStatus.innerHTML = Object.values(appData.cards).filter(c=>c.playerName).map(c => {
          const v = appData.votes[c.code];
          let content = `<span class="text-gray-500">⏳ 대기중</span>`;
          if (v) {
            if (v.isGhostReport) content = `<span class="text-purple-400 break-all">보고서: ${v.missionText}</span>`;
            else {
              let tNames = v.targets.map(t => appData.cards[t]?appData.cards[t].charName:'?').join(', ');
              content = `<span class="text-green-300 break-all">선택: [${tNames}] / 사유: ${v.reason}</span>`;
            }
          }
          return `<div class="bg-gray-900 p-2 rounded border border-gray-700 flex flex-col gap-1">
            <span class="font-bold text-gray-300">${c.charName}(${c.playerName})</span>
            <div class="text-[9px]">${content}</div>
          </div>`;
        }).join('');
      }

      const pMgmt = document.getElementById('adminPlayerMgmt');
      if(pMgmt) pMgmt.innerHTML = Object.values(appData.cards).map(c => `
        <div class="flex items-center gap-2 bg-gray-900 rounded p-1.5 border border-gray-700">
          <span class="w-12 truncate text-gray-400">${c.charIcon} ${c.charName}</span>
          <input type="text" value="${c.playerName}" onchange="updatePlayerName('${c.code}', this.value)" placeholder="미등록" class="flex-1 bg-black border border-gray-600 text-white px-1 py-0.5 rounded">
        </div>`).join('');

      const qLabel = document.getElementById('adminMg1QNum');
      if(qLabel) qLabel.innerText = appData.mg1.qIdx === 0 ? "연습문제" : `${appData.mg1.qIdx}번 문제`;
    }

    function renderAll() {
      const hash = window.location.hash.replace('#', '') || 'tv';
      if (hash === 'tv') renderTV();
      if (hash === 'admin') renderAdminRemote();
      if (hash === 'mobile' && activeMobileCode) renderMobileCard();
      if (hash === 'vote' && activeVoteCode) renderVoteForm();
    }

    if (!window.location.hash) window.location.hash = 'tv'; else routeView();
  </script>
</body>
</html>
